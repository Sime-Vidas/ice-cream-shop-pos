<!doctype html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ice Cream Shop POS</title>

    <link rel="stylesheet" href="/static/styles.css?v=3">
    <script defer src="/static/app.js?v=5"></script>
</head>

<body>
    <main class="pos">
        <section class="products-panel">
            <header class="panel-header">
                <div>
                    <p class="eyebrow">Prodaja</p>
                    <h1>Sladoled</h1>
                </div>

                <span class="status">Blagajna aktivna</span>
            </header>

            <div id="products" class="product-grid">
                <p>Učitavanje proizvoda...</p>
            </div>
        </section>

        <section class="order-panel">
            <header class="order-header">
                <div>
                    <p class="eyebrow">Trenutna narudžba</p>
                    <h2>Račun</h2>
                </div>

                <button id="clear-order" type="button">Obriši sve</button>
            </header>

            <div id="order-items" class="order-items">
                <p class="empty-order">Račun je prazan.</p>
            </div>

            <footer class="order-footer">
                <div class="total-row">
                    <span>Ukupno</span>
                    <strong id="total">0,00 €</strong>
                </div>

                <div class="payment-buttons">
                    <button type="button" data-payment-method="cash" disabled>
                        Gotovina
                    </button>

                    <button type="button" data-payment-method="card" disabled>
                        Kartica
                    </button>
                </div>
            </footer>
        </section>
    </main>
        <dialog id="receipt-dialog" class="receipt-dialog">
        <div class="receipt-success-icon" aria-hidden="true">✓</div>

        <p class="eyebrow">Prodaja završena</p>
        <h2>Račun je spremljen</h2>

        <p class="demo-warning">
            Demonstracijski račun — nije fiskaliziran
        </p>

        <dl class="receipt-details">
            <div>
                <dt>Broj računa</dt>
                <dd id="receipt-number">—</dd>
            </div>

            <div>
                <dt>Način plaćanja</dt>
                <dd id="receipt-payment">—</dd>
            </div>

            <div>
                <dt>Ukupno</dt>
                <dd id="receipt-total">0,00 €</dd>
            </div>
        </dl>

        <button id="close-receipt" type="button">
            Novi račun
        </button>
    </dialog>
</body>

</html>
